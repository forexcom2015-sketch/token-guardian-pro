name: GeckoTerminal live smoke test

on:
  push:
    branches: [main]
    paths:
      - "src/lib/analise-transacoes.server.ts"
      - "scripts/smoke-geckoterminal.mjs"
      - ".github/workflows/geckoterminal-live-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: geckoterminal-live-smoke
  cancel-in-progress: false

jobs:
  live-smoke:
    name: Live trade collection (4 networks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate live GeckoTerminal trade collection
        run: node scripts/smoke-geckoterminal.mjs
